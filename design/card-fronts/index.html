<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Developer Tarot · Asset review</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #111714;
        color: #eee2c7;
      }

      * { box-sizing: border-box; }
      body { margin: 0; padding: 2rem; }
      main { max-width: 1100px; margin: 0 auto; }
      h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); }
      .note { color: #b5c2b8; margin: .5rem 0 1.5rem; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
      input { accent-color: #68b5a2; }
      a { color: #9bd9c8; }
      a:focus-visible, input:focus-visible { outline: 3px solid #f1a64b; outline-offset: 3px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 1rem; }
      figure { margin: 0; min-width: 0; padding: .75rem; background: #1b2722; border: 1px solid #385347; border-radius: .5rem; }
      figure a { display: block; width: fit-content; max-width: 100%; margin: 0 auto; }
      img { display: block; width: 82px; height: auto; max-width: 100%; border-radius: .2rem; }
      main:has(#large:checked) .grid img { width: 164px; }
      figcaption { margin-top: .65rem; overflow-wrap: anywhere; }
      figcaption strong, figcaption span { display: block; }
      figcaption span { margin-top: .2rem; color: #aab8ae; font-size: .8rem; }
      .back { margin-top: 2rem; }
      .back img { width: 82px; margin-top: .5rem; }
      @media (max-width: 480px) { body { padding: 1rem; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Approved card-front artwork</h1>
      <p class="note">Approved 2026-11-02 · 16 front illustrations · Select an image to open its full-resolution PNG.</p>
      <div class="controls">
        <label><input id="large" type="checkbox"> Larger thumbnails (164px)</label>
        <a href="../../public/cards/card-back.webp">View existing card back</a>
      </div>
      <section class="grid" aria-label="Card front artwork">
        <figure><a href="merge-conflict.png"><img src="merge-conflict.png" alt="The Merge Conflict card front"></a><figcaption><strong>The Merge Conflict</strong><span>merge-conflict</span></figcaption></figure>
        <figure><a href="infinite-refactor.png"><img src="infinite-refactor.png" alt="The Infinite Refactor card front"></a><figcaption><strong>The Infinite Refactor</strong><span>infinite-refactor</span></figcaption></figure>
        <figure><a href="deprecated-api.png"><img src="deprecated-api.png" alt="The Deprecated API card front"></a><figcaption><strong>The Deprecated API</strong><span>deprecated-api</span></figcaption></figure>
        <figure><a href="friday-deploy.png"><img src="friday-deploy.png" alt="The Friday Deploy card front"></a><figcaption><strong>The Friday Deploy</strong><span>friday-deploy</span></figcaption></figure>
        <figure><a href="green-ci.png"><img src="green-ci.png" alt="The Green CI card front"></a><figcaption><strong>The Green CI</strong><span>green-ci</span></figcaption></figure>
        <figure><a href="missing-environment-variable.png"><img src="missing-environment-variable.png" alt="The Missing Environment Variable card front"></a><figcaption><strong>The Missing Environment Variable</strong><span>missing-environment-variable</span></figcaption></figure>
        <figure><a href="legacy-system.png"><img src="legacy-system.png" alt="The Legacy System card front"></a><figcaption><strong>The Legacy System</strong><span>legacy-system</span></figcaption></figure>
        <figure><a href="todo.png"><img src="todo.png" alt="The TODO card front"></a><figcaption><strong>The TODO</strong><span>todo</span></figcaption></figure>
        <figure><a href="rewrite.png"><img src="rewrite.png" alt="The Rewrite card front"></a><figcaption><strong>The Rewrite</strong><span>rewrite</span></figcaption></figure>
        <figure><a href="mvp.png"><img src="mvp.png" alt="The MVP card front"></a><figcaption><strong>The MVP</strong><span>mvp</span></figcaption></figure>
        <figure><a href="rubber-duck.png"><img src="rubber-duck.png" alt="The Rubber Duck card front"></a><figcaption><strong>The Rubber Duck</strong><span>rubber-duck</span></figcaption></figure>
        <figure><a href="unexpected-dependency.png"><img src="unexpected-dependency.png" alt="The Unexpected Dependency card front"></a><figcaption><strong>The Unexpected Dependency</strong><span>unexpected-dependency</span></figcaption></figure>
        <figure><a href="production-database.png"><img src="production-database.png" alt="The Production Database card front"></a><figcaption><strong>The Production Database</strong><span>production-database</span></figcaption></figure>
        <figure><a href="cache.png"><img src="cache.png" alt="The Cache card front"></a><figcaption><strong>The Cache</strong><span>cache</span></figcaption></figure>
        <figure><a href="code-review.png"><img src="code-review.png" alt="The Code Review card front"></a><figcaption><strong>The Code Review</strong><span>code-review</span></figcaption></figure>
        <figure><a href="rollback.png"><img src="rollback.png" alt="The Rollback card front"></a><figcaption><strong>The Rollback</strong><span>rollback</span></figcaption></figure>
      </section>
      <p class="back"><strong>Existing back reference</strong><br><a href="../../public/cards/card-back.webp">Open card-back.webp</a><img src="../../public/cards/card-back.webp" alt="Existing Developer Tarot card back"></p>
    </main>
  </body>
</html>
