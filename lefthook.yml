pre-commit:
  jobs:
    - name: Format check (staged files)
      glob: '*.{ts,tsx,json,yml,toml}'
      run: bun fmt --check {staged_files} --ignore-unknown
    - name: Lint (staged files)
      glob: '*.{ts,tsx,json,yml}'
      run: bun x --bun --no-install biome check {staged_files} --no-errors-on-unmatched

pre-push:
  jobs:
    - name: verify
      run: bun run verify
